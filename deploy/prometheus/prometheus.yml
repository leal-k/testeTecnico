# Coleta as métricas das instâncias da aplicação.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: testetecnico
    metrics_path: /metrics
    # O DNS do Compose devolve um endereço por réplica do serviço "app";
    # assim o Prometheus encontra todas as instâncias, quantas houver.
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8080
        refresh_interval: 10s
